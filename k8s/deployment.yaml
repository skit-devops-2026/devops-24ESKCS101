apiVersion: apps/v1
kind: Deployment
metadata:
  name: releaf-book
  labels:
    app: releaf-book
spec:
  replicas: 2
  selector:
    matchLabels:
      app: releaf-book
  template:
    metadata:
      labels:
        app: releaf-book
    spec:
      containers:
        - name: releaf-book
          image: ghcr.io/skit-devops-2026/devops-24eskcs101:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi