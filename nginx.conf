server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        default_type text/plain;
    }
}

# Internal-only metrics endpoint, scraped by the nginx exporter
server {
    listen 8080;
    location /stub_status {
        stub_status;
    }
}